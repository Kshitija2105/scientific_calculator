<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e0f11;
    --panel: #1c1e22;
    --panel-raised: #24262b;
    --key: #2a2d33;
    --key-hover: #34373e;
    --display-bg: #0a0f0c;
    --display-glow: rgba(126, 230, 149, 0.12);
    --phosphor: #8fe6a8;
    --phosphor-dim: #4c8a5c;
    --accent-fn: #52bcd6;
    --accent-fn-dim: #2c4a54;
    --accent-op: #ff9a4d;
    --accent-op-dim: #5a3c22;
    --accent-mod: #e6c35c;
    --text: #e7e5e0;
    --text-dim: #8a8d93;
    --border: #313339;
    --danger: #e2645a;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, #1a2a24 0%, transparent 45%),
      radial-gradient(circle at 100% 110%, #1c2230 0%, transparent 40%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding: 20px 12px;
  }
  .wrap{ width:100%; max-width: 440px; display:flex; flex-direction:column; gap:12px; }
  .title-row{ display:flex; align-items:baseline; justify-content:space-between; padding: 0 4px; }
  .title-row h1{ font-size: 12px; font-weight:600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--text-dim); margin:0; }
  .title-row .badge{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--phosphor-dim); }

  .calculator{
    background: linear-gradient(180deg, var(--panel-raised), var(--panel));
    border-radius: 22px; padding: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .controls{ display:flex; align-items:center; justify-content:space-between; padding: 2px 4px 10px; }
  .drg-btn{
    border:none; background: var(--key); color: var(--accent-fn);
    font-family:'IBM Plex Mono', monospace; font-size: 11px; font-weight:600; letter-spacing:0.05em;
    padding: 6px 12px; border-radius:8px; cursor:pointer; transition: background .15s;
  }
  .drg-btn:hover{ background: var(--key-hover); }
  .icon-btn{
    border:none; background: var(--key); color: var(--text-dim);
    width:30px; height:30px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition: background .15s, color .15s;
  }
  .icon-btn:hover{ background: var(--key-hover); color: var(--text); }
  .icon-btn.on{ color: var(--phosphor); }

  .display{
    background: var(--display-bg); border-radius: 14px; padding: 16px 16px 14px; margin-bottom: 10px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), 0 0 22px var(--display-glow);
    position:relative; overflow:hidden; min-height: 88px;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .display::after{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .status-row{ display:flex; gap:8px; font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.08em; min-height:12px; margin-bottom:2px; }
  .status-row span{ color: var(--accent-mod); opacity:0; transition: opacity .1s; }
  .status-row span.show{ opacity:1; }
  .expr-line{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--phosphor-dim); min-height: 16px; text-align:right; word-break: break-all; letter-spacing: 0.02em; }
  .result-line{
    font-family:'IBM Plex Mono', monospace; font-weight:500; color: var(--phosphor); text-align:right;
    text-shadow: 0 0 14px rgba(143,230,168,0.45); font-size: clamp(24px, 7.5vw, 34px);
    line-height:1.15; white-space: nowrap; overflow-x:auto; scrollbar-width:none;
  }
  .result-line::-webkit-scrollbar{ display:none; }
  .result-line.error{ color: var(--danger); text-shadow: 0 0 14px rgba(226,100,90,0.35); }

  .history{ max-height: 0; overflow:hidden; transition: max-height .25s ease, margin .25s ease; background: var(--display-bg); border-radius: 14px; }
  .history.open{ max-height: 160px; margin-bottom: 10px; }
  .history-inner{ padding: 8px 14px; max-height: 160px; overflow-y: auto; }
  .history-empty{ font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--text-dim); padding: 8px 2px; }
  .history-item{ display:flex; justify-content:space-between; align-items:baseline; padding: 6px 2px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor:pointer; font-family:'IBM Plex Mono', monospace; }
  .history-item:last-child{ border-bottom:none; }
  .history-item:hover .history-result{ color: var(--phosphor); }
  .history-expr{ font-size:11px; color: var(--text-dim); }
  .history-result{ font-size:13px; color: var(--text); transition: color .15s; }

  .keypad{ display:grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  button.key{
    border:none; border-radius: 10px; background: var(--key); color: var(--text);
    font-family:'IBM Plex Mono', monospace; font-size: 13px; font-weight:500;
    padding: 10px 2px; cursor:pointer; transition: background .12s, transform .06s;
    -webkit-tap-highlight-color: transparent; position:relative;
  }
  button.key:hover{ background: var(--key-hover); }
  button.key:active{ transform: scale(0.93); }
  .shift-tag{ position:absolute; top:2px; left:5px; font-size:8px; color: var(--accent-mod); letter-spacing:0; font-weight:600; }

  button.key.fn{ color: var(--accent-fn); background: rgba(82,188,214,0.08); }
  button.key.fn:hover{ background: rgba(82,188,214,0.16); }
  button.key.op{ color: var(--accent-op); background: rgba(255,154,77,0.08); font-size:16px; }
  button.key.op:hover{ background: rgba(255,154,77,0.16); }
  button.key.mod{ color: var(--accent-mod); background: rgba(230,195,92,0.08); font-size:11px; }
  button.key.mod:hover{ background: rgba(230,195,92,0.18); }
  button.key.mod.active{ background: var(--accent-mod); color: #241d05; }
  button.key.equals{ background: linear-gradient(180deg, #6fd88a, #4fae6d); color: #0a1a10; font-weight:700; font-size: 17px; }
  button.key.equals:hover{ filter: brightness(1.08); }
  button.key.util{ color: var(--text-dim); font-size:12px; }
  button.key.util.clear{ color: var(--danger); }

  .legend{ font-size:11px; color: var(--text-dim); line-height:1.6; padding: 2px 6px; }
  .legend b{ color: var(--accent-mod); font-weight:600; }

  @media (max-width: 380px){
    button.key{ font-size:11.5px; padding: 9px 1px; }
    button.key.op{ font-size:14px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="title-row">
    <h1>Scientific Calculator</h1>
    <span class="badge" id="memBadge"></span>
  </div>

  <div class="calculator">
    <div class="controls">
      <button class="drg-btn" id="drgBtn" onclick="cycleAngleMode()">DEG</button>
      <button class="icon-btn" id="histToggle" onclick="toggleHistory()" title="History" aria-label="Toggle history">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
      </button>
    </div>

    <div class="display">
      <div class="status-row">
        <span id="shiftTag">SHIFT</span>
        <span id="hypTag">HYP</span>
      </div>
      <div class="expr-line" id="exprLine">&nbsp;</div>
      <div class="result-line" id="resultLine">0</div>
    </div>

    <div class="history" id="historyPanel">
      <div class="history-inner" id="historyInner"><div class="history-empty">No calculations yet</div></div>
    </div>

    <div class="keypad">
      <button class="key mod" id="shiftKey" onclick="toggleShift()">SHIFT</button>
      <button class="key mod" id="hypKey" onclick="toggleHyp()">HYP</button>
      <button class="key fn" onclick="pressRCL()"><span class="shift-tag">STO</span>RCL</button>
      <button class="key fn" onclick="pressMemAdd()"><span class="shift-tag">M−</span>M+</button>
      <button class="key util" onclick="pressPercent()">%</button>

      <button class="key fn" onclick="pressTrig('sin')"><span class="shift-tag">sin⁻¹</span>sin</button>
      <button class="key fn" onclick="pressTrig('cos')"><span class="shift-tag">cos⁻¹</span>cos</button>
      <button class="key fn" onclick="pressTrig('tan')"><span class="shift-tag">tan⁻¹</span>tan</button>
      <button class="key" onclick="pressRaw('(')">(</button>
      <button class="key" onclick="pressRaw(')')">)</button>

      <button class="key fn" onclick="pressLn()"><span class="shift-tag">eˣ</span>ln</button>
      <button class="key fn" onclick="pressLog()"><span class="shift-tag">10ˣ</span>log</button>
      <button class="key fn" onclick="pressSqrt()"><span class="shift-tag">³√</span>√</button>
      <button class="key fn" onclick="pressSquare()"><span class="shift-tag">x³</span>x²</button>
      <button class="key fn" onclick="pressPow()"><span class="shift-tag">ˣ√y</span>^</button>

      <button class="key fn" onclick="pressInv()"><span class="shift-tag">x!</span>x⁻¹</button>
      <button class="key util" onclick="toggleFraction()">a b/c</button>
      <button class="key" onclick="pressRaw('π')">π</button>
      <button class="key" onclick="pressRaw('e')">e</button>
      <button class="key util" onclick="pressRan()">Ran#</button>

      <button class="key" onclick="pressRaw('7')">7</button>
      <button class="key" onclick="pressRaw('8')">8</button>
      <button class="key" onclick="pressRaw('9')">9</button>
      <button class="key op" onclick="pressRaw('÷')">÷</button>
      <button class="key util" onclick="backspace()">DEL</button>

      <button class="key" onclick="pressRaw('4')">4</button>
      <button class="key" onclick="pressRaw('5')">5</button>
      <button class="key" onclick="pressRaw('6')">6</button>
      <button class="key op" onclick="pressRaw('×')">×</button>
      <button class="key util clear" onclick="clearAll()">AC</button>

      <button class="key" onclick="pressRaw('1')">1</button>
      <button class="key" onclick="pressRaw('2')">2</button>
      <button class="key" onclick="pressRaw('3')">3</button>
      <button class="key op" onclick="pressRaw('−')">−</button>
      <button class="key util" onclick="pressComb('nPr')">nPr</button>

      <button class="key" onclick="pressRaw('-')">(-)</button>
      <button class="key" onclick="pressRaw('0')">0</button>
      <button class="key" onclick="pressRaw('.')">.</button>
      <button class="key op" onclick="pressRaw('+')">+</button>
      <button class="key equals" onclick="evaluate(true)">=</button>

      <button class="key util" onclick="pressAns()">Ans</button>
      <button class="key util" onclick="toggleEng()">ENG</button>
      <button class="key util" onclick="pressComb('nCr')">nCr</button>
      <button class="key util" onclick="pressRnd()">Rnd</button>
      <button class="key util" onclick="pressFact()">x!</button>
    </div>

    <div class="legend">
      <b>SHIFT</b> + a key uses its yellow label above · <b>HYP</b> + sin/cos/tan gives sinh/cosh/tanh (SHIFT+HYP for the inverse) · both reset after one key press, just like the real thing.
    </div>
  </div>
</div>

<script>
/* ============================================================
   STATE
   ============================================================ */
let expr = '';
let angleMode = 'deg';       // 'deg' | 'rad' | 'grad'
let memory = 0;
let lastAnswer = 0;
let history = [];
let justEvaluated = false;
let shiftActive = false;
let hypActive = false;
let fractionView = false;
let engView = false;
let lastDecimalDisplay = '0';

const exprLine = document.getElementById('exprLine');
const resultLine = document.getElementById('resultLine');
const memBadge = document.getElementById('memBadge');
const shiftKey = document.getElementById('shiftKey');
const hypKey = document.getElementById('hypKey');
const shiftTag = document.getElementById('shiftTag');
const hypTag = document.getElementById('hypTag');

const CONTINUE_OPS = new Set(['+','−','×','÷','^','!','²','³','⁻¹','%','nPr','nCr']);

/* ============================================================
   MODIFIER KEYS (SHIFT / HYP) — one-shot, like the real device
   ============================================================ */
function toggleShift(){
  shiftActive = !shiftActive;
  updateModifierUI();
}
function toggleHyp(){
  hypActive = !hypActive;
  updateModifierUI();
}
function resetModifiers(){
  shiftActive = false;
  hypActive = false;
  updateModifierUI();
}
function updateModifierUI(){
  shiftKey.classList.toggle('active', shiftActive);
  hypKey.classList.toggle('active', hypActive);
  shiftTag.classList.toggle('show', shiftActive);
  hypTag.classList.toggle('show', hypActive);
}

/* ============================================================
   CORE INPUT
   ============================================================ */
function inputVal(v){
  if(justEvaluated){
    const isContinuation = CONTINUE_OPS.has(v);
    expr = isContinuation ? resultLine.textContent : '';
    justEvaluated = false;
  }
  fractionView = false; engView = false;
  expr += v;
  render();
}
function pressRaw(v){ inputVal(v); resetModifiers(); }

function backspace(){
  justEvaluated = false; fractionView = false; engView = false;
  expr = expr.slice(0, -1);
  render();
  resetModifiers();
}
function clearAll(){
  expr = ''; justEvaluated = false; fractionView = false; engView = false;
  resultLine.classList.remove('error');
  render();
  resetModifiers();
}

/* ============================================================
   ANGLE MODE
   ============================================================ */
function cycleAngleMode(){
  angleMode = angleMode === 'deg' ? 'rad' : angleMode === 'rad' ? 'grad' : 'deg';
  document.getElementById('drgBtn').textContent = angleMode.toUpperCase();
  render();
}
function toRad(x){ return angleMode === 'deg' ? x*Math.PI/180 : angleMode === 'grad' ? x*Math.PI/200 : x; }
function fromRad(x){ return angleMode === 'deg' ? x*180/Math.PI : angleMode === 'grad' ? x*200/Math.PI : x; }

/* ============================================================
   FUNCTION / OPERATOR KEY HANDLERS
   ============================================================ */
function pressTrig(base){
  let name;
  if(hypActive && shiftActive) name = 'a' + base + 'h';
  else if(hypActive) name = base + 'h';
  else if(shiftActive) name = 'a' + base;
  else name = base;
  inputVal(name + '(');
  resetModifiers();
}
function pressLn(){ inputVal(shiftActive ? 'e^(' : 'ln('); resetModifiers(); }
function pressLog(){ inputVal(shiftActive ? '10^(' : 'log('); resetModifiers(); }
function pressSqrt(){ inputVal(shiftActive ? 'cbrt(' : 'sqrt('); resetModifiers(); }
function pressSquare(){ inputVal(shiftActive ? '³' : '²'); resetModifiers(); }
function pressPow(){ inputVal(shiftActive ? 'ˣ√' : '^'); resetModifiers(); }
function pressInv(){ inputVal(shiftActive ? '!' : '⁻¹'); resetModifiers(); }
function pressFact(){ inputVal('!'); resetModifiers(); }
function pressPercent(){ inputVal('%'); resetModifiers(); }
function pressComb(op){ inputVal(op); resetModifiers(); }
function pressAns(){ inputVal(formatNumber(lastAnswer)); resetModifiers(); }
function pressRan(){
  const r = (Math.floor(Math.random()*1000)/1000).toFixed(3);
  inputVal(r);
  resetModifiers();
}

/* Memory */
function currentValue(){
  const res = safeEval(toEvaluable(expr || resultLine.textContent));
  return res.ok ? res.value : null;
}
function pressRCL(){
  if(shiftActive){
    const v = currentValue();
    if(v !== null){ memory = v; updateMemBadge(); }
  } else {
    inputVal(formatNumber(memory));
  }
  resetModifiers();
}
function pressMemAdd(){
  const v = currentValue();
  if(v !== null){
    if(shiftActive) memory -= v; else memory += v;
    updateMemBadge();
  }
  resetModifiers();
}
function updateMemBadge(){
  memBadge.textContent = memory !== 0 ? 'M = ' + formatNumber(memory) : '';
}

/* Rounding */
function pressRnd(){
  const v = currentValue();
  if(v !== null){
    const rounded = parseFloat(v.toPrecision(10));
    expr = formatNumber(rounded);
    justEvaluated = true;
    render();
  }
  resetModifiers();
}

/* Fraction / Engineering view (display-only toggles on the current result) */
function toggleFraction(){
  const raw = parseFloat(resultLine.dataset.raw ?? resultLine.textContent);
  if(isNaN(raw)) { resetModifiers(); return; }
  engView = false;
  fractionView = !fractionView;
  resultLine.dataset.raw = raw;
  resultLine.textContent = fractionView ? toFractionString(raw) : formatNumber(raw);
  resetModifiers();
}
function toggleEng(){
  const raw = parseFloat(resultLine.dataset.raw ?? resultLine.textContent);
  if(isNaN(raw)) { resetModifiers(); return; }
  fractionView = false;
  engView = !engView;
  resultLine.dataset.raw = raw;
  resultLine.textContent = engView ? toEngString(raw) : formatNumber(raw);
  resetModifiers();
}

/* ============================================================
   RENDER / EVALUATE
   ============================================================ */
function render(){
  exprLine.textContent = expr.length ? expr : '\u00A0';
  if(expr.trim() === ''){
    resultLine.textContent = '0';
    resultLine.dataset.raw = '0';
    resultLine.classList.remove('error');
    return;
  }
  const res = safeEval(toEvaluable(expr));
  if(res.ok){
    resultLine.textContent = formatNumber(res.value);
    resultLine.dataset.raw = res.value;
    resultLine.classList.remove('error');
  } else if(!res.incomplete){
    resultLine.textContent = 'Error';
    resultLine.classList.add('error');
  }
}

function evaluate(commit){
  if(expr.trim() === '') return;
  const res = safeEval(toEvaluable(expr));
  if(!res.ok){
    resultLine.textContent = 'Error';
    resultLine.classList.add('error');
    resetModifiers();
    return;
  }
  resultLine.textContent = formatNumber(res.value);
  resultLine.dataset.raw = res.value;
  resultLine.classList.remove('error');
  if(commit){
    lastAnswer = res.value;
    history.unshift({ expr, result: formatNumber(res.value) });
    history = history.slice(0, 20);
    renderHistory();
    justEvaluated = true;
  }
  resetModifiers();
}

function formatNumber(n){
  if(!isFinite(n)) return 'Error';
  if(Object.is(n, -0)) n = 0;
  const rounded = Math.round(n * 1e10) / 1e10;
  if(Math.abs(rounded) >= 1e15 || (Math.abs(rounded) < 1e-9 && rounded !== 0)){
    return rounded.toExponential(6).replace(/\.?0+e/, 'e');
  }
  return rounded.toString();
}

function toFraction(x, maxDen = 100000){
  const sign = x < 0 ? -1 : 1; x = Math.abs(x);
  const whole = Math.floor(x);
  let frac = x - whole;
  if(frac < 1e-9) return { whole, num: 0, den: 1, sign };
  let h1=1, h2=0, k1=0, k2=1, b=frac, a;
  do{
    a = Math.floor(b);
    [h1, h2] = [a*h1 + h2, h1];
    [k1, k2] = [a*k1 + k2, k1];
    b = 1/(b - a);
  } while(Math.abs(x - (whole + h1/k1)) > x*1e-9 + 1e-12 && k1 < maxDen && isFinite(b));
  return { whole, num: h1, den: k1, sign };
}
function toFractionString(x){
  const f = toFraction(x);
  if(f.den === 1) return formatNumber(x);
  const s = f.sign < 0 ? '-' : '';
  return f.whole === 0 ? `${s}${f.num}/${f.den}` : `${s}${f.whole} ${f.num}/${f.den}`;
}
function toEngString(x){
  if(x === 0) return '0';
  const sign = x < 0 ? '-' : ''; x = Math.abs(x);
  let e = Math.floor(Math.log10(x));
  e = Math.floor(e/3)*3;
  const mantissa = x / Math.pow(10, e);
  return `${sign}${formatNumber(mantissa)}${e !== 0 ? '×10^' + e : ''}`;
}

/* ============================================================
   HISTORY
   ============================================================ */
function toggleHistory(){
  document.getElementById('historyPanel').classList.toggle('open');
  document.getElementById('histToggle').classList.toggle('on');
}
function renderHistory(){
  const c = document.getElementById('historyInner');
  if(history.length === 0){ c.innerHTML = '<div class="history-empty">No calculations yet</div>'; return; }
  c.innerHTML = history.map(h => `
    <div class="history-item" onclick="recall('${h.result}')">
      <span class="history-expr">${h.expr}</span>
      <span class="history-result">${h.result}</span>
    </div>`).join('');
}
function recall(result){
  expr = result; justEvaluated = false; fractionView = false; engView = false;
  render();
}

/* ============================================================
   DISPLAY SYMBOLS -> EVALUABLE STRING
   ============================================================ */
function toEvaluable(s){
  return s.replace(/×/g, '*').replace(/÷/g, '/').replace(/π/g, 'pi').replace(/−/g, '-');
}

/* ============================================================
   SAFE RECURSIVE-DESCENT PARSER
   expr   := term (('+'|'-') term)*
   term   := comb (('*'|'/') comb)*
   comb   := unary (('nPr'|'nCr') unary)*
   unary  := '-' unary | power
   power  := postfix (('^'|'nroot') unary)?      (right-associative)
   postfix:= primary ('!'|'²'|'³'|'⁻¹'|'%')*
   primary:= number | const | fn '(' expr ')' | '(' expr ')'
   ============================================================ */
function safeEval(str){
  try{
    if(str.trim() === '') return { ok:false, incomplete:true };
    const tokens = tokenize(str);
    let pos = 0;
    const peek = () => tokens[pos];
    const next = () => tokens[pos++];

    function parseExpr(){
      let v = parseTerm();
      while(peek() === '+' || peek() === '-'){
        const op = next(); const rhs = parseTerm();
        v = op === '+' ? v + rhs : v - rhs;
      }
      return v;
    }
    function parseTerm(){
      let v = parseComb();
      while(peek() === '*' || peek() === '/'){
        const op = next(); const rhs = parseComb();
        v = op === '*' ? v * rhs : v / rhs;
      }
      return v;
    }
    function parseComb(){
      let v = parseUnary();
      while(peek() === 'nPr' || peek() === 'nCr'){
        const op = next(); const rhs = parseUnary();
        v = op === 'nPr' ? nPr(v, rhs) : nCr(v, rhs);
      }
      return v;
    }
    function parseUnary(){
      if(peek() === '-'){ next(); return -parseUnary(); }
      if(peek() === '+'){ next(); return parseUnary(); }
      return parsePower();
    }
    function parsePower(){
      let base = parsePostfix();
      if(peek() === '^' || peek() === 'nroot'){
        const op = next();
        const exp = parseUnary();
        return op === '^' ? Math.pow(base, exp) : Math.pow(exp, 1/base);
      }
      return base;
    }
    function parsePostfix(){
      let v = parsePrimary();
      while(['!','²','³','⁻¹','%'].includes(peek())){
        const op = next();
        if(op === '!') v = factorial(v);
        else if(op === '²') v = v*v;
        else if(op === '³') v = v*v*v;
        else if(op === '⁻¹') v = 1/v;
        else if(op === '%') v = v/100;
      }
      return v;
    }
    function parsePrimary(){
      const t = peek();
      if(t === undefined) throw new Error('Unexpected end');
      if(t === '('){ next(); const v = parseExpr(); if(peek() !== ')') throw new Error('Expected )'); next(); return v; }
      if(typeof t === 'number'){ next(); return t; }
      if(t === 'pi'){ next(); return Math.PI; }
      if(t === 'e'){ next(); return Math.E; }
      const FUNCS = {
        sin: x => Math.sin(toRad(x)), cos: x => Math.cos(toRad(x)), tan: x => Math.tan(toRad(x)),
        asin: x => fromRad(Math.asin(x)), acos: x => fromRad(Math.acos(x)), atan: x => fromRad(Math.atan(x)),
        sinh: x => Math.sinh(x), cosh: x => Math.cosh(x), tanh: x => Math.tanh(x),
        asinh: x => Math.asinh(x), acosh: x => Math.acosh(x), atanh: x => Math.atanh(x),
        ln: x => Math.log(x), log: x => Math.log10(x), sqrt: x => Math.sqrt(x), cbrt: x => Math.cbrt(x),
      };
      if(FUNCS[t]){
        next();
        if(peek() !== '(') throw new Error('Expected ( after ' + t);
        next();
        const arg = parseExpr();
        if(peek() !== ')') throw new Error('Expected )');
        next();
        return FUNCS[t](arg);
      }
      throw new Error('Unexpected token: ' + t);
    }

    const result = parseExpr();
    if(pos < tokens.length) throw new Error('Trailing tokens');
    if(typeof result !== 'number' || Number.isNaN(result)) return { ok:false, incomplete:false };
    return { ok:true, value: result };
  } catch(e){
    return { ok:false, incomplete:true };
  }
}

function factorial(n){
  if(n < 0 || !Number.isInteger(n)) throw new Error('Factorial requires a non-negative integer');
  if(n > 170) return Infinity;
  let r = 1;
  for(let i = 2; i <= n; i++) r *= i;
  return r;
}
function nPr(n, r){
  if(!Number.isInteger(n) || !Number.isInteger(r) || n < 0 || r < 0 || r > n) throw new Error('invalid nPr');
  return factorial(n) / factorial(n - r);
}
function nCr(n, r){
  if(!Number.isInteger(n) || !Number.isInteger(r) || n < 0 || r < 0 || r > n) throw new Error('invalid nCr');
  return factorial(n) / (factorial(r) * factorial(n - r));
}

/* ---- tokenizer ---- */
function tokenize(str){
  const tokens = [];
  let i = 0;
  const WORDS = ['asinh','acosh','atanh','sinh','cosh','tanh','asin','acos','atan','sin','cos','tan',
                 'ln','log','cbrt','sqrt','pi','nPr','nCr','nroot','e'];
  while(i < str.length){
    const c = str[i];
    if(/\s/.test(c)){ i++; continue; }
    if(/[0-9.]/.test(c)){
      let j = i;
      while(j < str.length && /[0-9.]/.test(str[j])) j++;
      tokens.push(parseFloat(str.slice(i, j)));
      i = j; continue;
    }
    if(str.slice(i, i+2) === '⁻¹'){ tokens.push('⁻¹'); i += 2; continue; }
    if(str.slice(i, i+2) === 'ˣ√'){ tokens.push('nroot'); i += 2; continue; }
    if(c === '²'){ tokens.push('²'); i++; continue; }
    if(c === '³'){ tokens.push('³'); i++; continue; }
    if(c === '%'){ tokens.push('%'); i++; continue; }
    if(/[a-zA-Z]/.test(c)){
      let j = i;
      while(j < str.length && /[a-zA-Z]/.test(str[j])) j++;
      const word = str.slice(i, j);
      if(WORDS.includes(word)){ tokens.push(word); i = j; continue; }
      throw new Error('Unknown identifier: ' + word);
    }
    if('+-*/^()!'.includes(c)){ tokens.push(c); i++; continue; }
    throw new Error('Unexpected character: ' + c);
  }
  return tokens;
}

/* ============================================================
   KEYBOARD SUPPORT
   ============================================================ */
document.addEventListener('keydown', (e) => {
  const map = { '*':'×', '/':'÷' };
  if(/[0-9.()+\-*/^!]/.test(e.key)){
    pressRaw(map[e.key] || e.key);
    e.preventDefault();
  } else if(e.key === 'Enter' || e.key === '='){
    evaluate(true); e.preventDefault();
  } else if(e.key === 'Backspace'){
    backspace(); e.preventDefault();
  } else if(e.key === 'Escape'){
    clearAll(); e.preventDefault();
  } else if(e.key === 'Shift'){
    toggleShift(); e.preventDefault();
  }
});

render();
